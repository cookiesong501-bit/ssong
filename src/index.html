<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'"><title>오늘의 할 일</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">✓ <span>오늘의 할 일</span></div><label class="setting"><input type="checkbox" id="autostart"> 로그인 시 자동 실행</label></header><main><section class="list-panel"><div class="eyebrow">MAKE ROOM FOR YOUR DAY</div><h1>차근차근, 오늘도.</h1><p class="subtitle">작은 계획을 하나씩 채워 보세요.</p><div class="day-heading"><h2 id="day-title"></h2><button id="today">오늘로</button></div><div class="progress"><div id="progress-bar"></div></div><p id="summary"></p><div id="tasks"></div><form id="add-form"><label>할 일<input id="text" placeholder="어떤 일을 해볼까요?" maxlength="200" required></label><div class="time-row"><label>시작 시간<input type="time" id="start" value="09:00" required></label><span>→</span><label>마감 시간<input type="time" id="end" value="10:00" required></label><button class="primary" type="submit" id="submit">+ 일정 추가</button></div><button type="button" id="cancel-edit" hidden>수정 취소</button></form><p id="message" role="status"></p><footer>창을 닫아도 트레이에서 알림을 확인할 수 있어요.</footer></section><aside><div class="calendar-title"><h2 id="month-title"></h2><div><button id="prev" aria-label="이전 달">‹</button><button id="next" aria-label="다음 달">›</button></div></div><div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar"></div><div class="legend"><i></i> 예정 · 진행 중 <i class="muted"></i> 완료 · 보류</div><div class="note">내 일정, 내 컴퓨터에.<p>작성한 일정은 이 컴퓨터에 자동 저장됩니다.</p></div></aside></main><dialog id="status-dialog"><h2>일정 상태를 선택하세요</h2><p id="status-text"></p><div class="status-actions"><button data-status="done">✓ 완료</button><button data-status="hold">Ⅱ 보류</button><button data-status="active">진행 중</button><button data-status="planned">예정</button></div><button id="close-status">닫기</button></dialog><script src="model.js"></script><script src="app.js"></script></body></html>
