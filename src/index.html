<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'"><title>오늘의 할 일</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><b class="brand-mark" aria-hidden="true">✓</b><div><span>오늘의 할 일</span><small>나의 하루를 담는 작은 다이어리</small></div></div><label class="setting"><input type="checkbox" id="autostart"> 로그인 시 자동 실행</label></header><main><section class="list-panel"><div class="eyebrow">나를 위한 하루, 한 페이지</div><h1>차근차근, 오늘도.</h1><p class="subtitle">서두르지 말고, 오늘의 작은 계획부터 채워 봐요.</p><div class="day-heading"><h2 id="day-title"></h2><button id="today">오늘로</button></div><div class="progress"><div id="progress-bar"></div></div><p id="summary"></p><div id="tasks"></div><form id="add-form"><span class="form-caption">✎ 오늘의 다이어리에 적기</span><label>할 일<input id="text" placeholder="어떤 일을 해볼까요?" maxlength="200" required></label><div class="time-row"><label>시작 시간<input type="hidden" id="start" value="09:00"><span class="time-picker" id="start-picker"></span></label><span>→</span><label>마감 시간<input type="hidden" id="end" value="10:00"><span class="time-picker" id="end-picker"></span></label><button class="primary" type="submit" id="submit">+ 일정 추가</button></div><label class="next-day"><input type="checkbox" id="end-next-day"> 다음 날 마감 <span id="overnight-hint"></span></label><button type="button" id="cancel-edit" hidden>수정 취소</button></form><p id="message" role="status"></p><footer>창을 닫아도 트레이에서 알림을 확인할 수 있어요.</footer></section><aside><p class="calendar-eyebrow">이달의 페이지 · MONTHLY</p><div class="calendar-title"><h2 id="month-title"></h2><div><button id="prev" aria-label="이전 달">‹</button><button id="next" aria-label="다음 달">›</button></div></div><div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar"></div><div class="legend"><i></i> 예정 · 진행 중 <i class="muted"></i> 완료 · 보류</div><section class="reminder-panel"><h2>나만의 반복 알람 🔔</h2><p>지금부터 정한 간격마다 다정하게 알려드려요.</p><form id="reminder-form"><label>알람 메모<input id="reminder-text" maxlength="200" placeholder="물 한 잔 마시기"></label><div class="time-row"><label>간격 (분)<input type="number" id="reminder-interval" min="1" max="1440" value="5" required></label><label>횟수 (1~5회)<input type="number" id="reminder-count" min="1" max="5" value="5" required></label><button class="primary">알람 시작</button></div></form><p id="reminder-message" role="status"></p><div id="reminders"></div></section><div class="note">오늘의 기록은 소중하게.<p>작성한 일정은 이 컴퓨터에 자동 저장됩니다.</p></div></aside></main><dialog id="status-dialog"><h2>일정 상태를 선택하세요</h2><p id="status-text"></p><div class="status-actions"><button data-status="done">✓ 완료</button><button data-status="hold">Ⅱ 보류</button><button data-status="active">진행 중</button><button data-status="planned">예정</button></div><button id="close-status">닫기</button></dialog><script src="model.js"></script><script src="time-picker.js"></script><script src="app.js"></script></body></html>
